# Opens a pull request to GuillaumeBAUD-coder/open-math-agents for every proof queued in oma-queue/.
# Each queue file: line 1 = branch name in this fork, line 2 = PR title, remaining lines = PR body.
# Needs the repository secret OMA_PR_TOKEN (classic token with the public_repo scope).
name: open-proof-prs
on:
  push:
    branches: [main]
    paths: ['oma-queue/**', '.github/workflows/open-proof-prs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the token
        env:
          GH_TOKEN: ${{ secrets.OMA_PR_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "OMA_PR_TOKEN secret is missing"; exit 1; fi
          echo "Token belongs to: $(gh api user --jq .login)"
      - name: Open PRs for queued proofs
        env:
          GH_TOKEN: ${{ secrets.OMA_PR_TOKEN }}
        run: |
          for f in oma-queue/*.txt; do
            [ -e "$f" ] || continue
            branch=$(sed -n 1p "$f"); title=$(sed -n 2p "$f")
            existing=$(gh pr list --repo GuillaumeBAUD-coder/open-math-agents --head "$branch" \
              --author eitanteperman --state all --json number --jq '.[].number' || true)
            if [ -n "$existing" ]; then echo "PR already exists for $branch: #$existing"; continue; fi
            tail -n +3 "$f" > body.md
            gh pr create --repo GuillaumeBAUD-coder/open-math-agents --base main \
              --head "eitanteperman:$branch" --title "$title" --body-file body.md \
              || echo "FAILED to open a PR for $branch (it may already be solved)"
          done
